<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Migdalia Art" />
    <title>Migdalia Art</title>
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <header class="site-header">
      <a class="site-logo" href="./">Migdalia Art</a>
      <nav class="site-nav" aria-label="Main">
        <a href="#work">Work</a>
        <a href="#about">About</a>
        <a href="#contact">Contact</a>
      </nav>
    </header>

    <main>
      <section class="hero" id="home">
        <h1>Migdalia Art</h1>
        <p class="hero-lead">
          Welcome. Replace this section with your hero content, featured work, or
          studio introduction.
        </p>
      </section>

      <section class="section" id="work">
        <h2>Work</h2>
        <p>Add your portfolio grid or gallery here.</p>
      </section>

      <section class="section" id="about">
        <h2>About</h2>
        <p>Add your artist bio here.</p>
      </section>

      <section class="section" id="contact">
        <h2>Contact</h2>
        <p>Add your email, social links, or contact form here.</p>
      </section>
    </main>

    <footer class="site-footer">
      <p>&copy; <span id="year"></span> Migdalia Art</p>
    </footer>

    <script src="js/main.js"></script>
  </body>
</html>
